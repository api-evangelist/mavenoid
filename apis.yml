name: Mavenoid
description: 'Mavenoid is an AI agent platform for product support, helping hardware
  and consumer-electronics companies deflect and resolve customer issues through self-service
  troubleshooting across voice, text, image, and video. Its products include Voice
  Assist (AI call routing and self-service), a Dynamic Help Center that surfaces AI-powered
  support in search results, an embeddable Virtual Assistant, and an Insights analytics
  dashboard. Mavenoid connects to CRM, ticketing, ERP, e-commerce, and IoT systems.
  The company is backed by Creandum and Point Nine. As of this enrichment pass Mavenoid
  publishes no public developer API, OpenAPI/AsyncAPI specification, SDK, or well-known
  discovery surface; integrations are configured within its product rather than via
  a documented public REST API.'
